# Mise en ligne : le site (Node.js) derrière Caddy, qui gère le HTTPS
# (certificats Let's Encrypt obtenus et renouvelés automatiquement).
# Renseignez DOMAIN dans le fichier .env, puis : docker compose up -d --build
name: subnet

services:
  site:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - subnet-data:/data
    networks:
      default:
        # Nom propre à Subnet : Caddy ne peut pas le confondre avec le service
        # d'un autre site hébergé sur le même serveur.
        aliases:
          - subnet-site

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - web

networks:
  # Réseau partagé avec les autres sites hébergés sur ce serveur : Caddy y
  # joint chacun par le nom de son service (voir scripts/add-site.sh).
  web:
    name: web

volumes:
  subnet-data:
  caddy-data:
  caddy-config:
